<!DOCTYPE html>
<html>
<head>
    <title>Welcome - Art Gallery</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f5e6d3;
        }

        .welcome-box {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            color: #6b3e26;
            font-size: 40px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background: #6b3e26;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <h1>🎨 Welcome to My Art Gallery</h1>

        <p>Explore beautiful artworks created with creativity and passion.</p>

        <button onclick="window.location.href='gallery.html'">
    View Gallery
</button>

    </div>

</body>
</html>
